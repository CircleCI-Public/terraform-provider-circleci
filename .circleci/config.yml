version: 2.1

x_values:
  # Both modules feed the caches: the root module for the provider itself, and
  # tools/ for the tools `go tool` builds from source.
  checksum: &checksum '{{ checksum "go.sum" }}_{{ checksum "tools/go.sum" }}'

orbs:
  go: circleci/go@3.0.3
  terraform: circleci/terraform@3.7.0

commands:
  store_results:
    steps:
      - store_artifacts:
          path: test-reports
      - store_test_results:
          path: test-reports

  setup:
    parameters:
      terraform-version:
        type: string
        default: "1.12.2"
      install-terraform:
        description: >
          Only the jobs that run acceptance tests or regenerate the docs need
          terraform. The unit-test job skips the install to stay fast.
        type: boolean
        default: true
    steps:
      - checkout
      - run: task mod-download
      - when:
          condition: <<parameters.install-terraform>>
          steps:
            - terraform/install:
                terraform_version: <<parameters.terraform-version>>

jobs:
  check:
    executor:
      name: go/default
      tag: '1.26.1'
    steps:
      - setup
      - go/with-cache:
          checksum: *checksum
          golangci-lint: true
          steps:
            - run: task ci:check
      - store_results

  # Unit tests only, for fast feedback. TF_ACC is unset so the acceptance tests
  # skip themselves, meaning this job needs neither an API token nor terraform.
  test:
    executor:
      name: go/default
      tag: '1.26.1'
    steps:
      - setup:
          install-terraform: false
      - go/with-cache:
          checksum: *checksum
          steps:
            - run: task ci:test
      - store_results

  build-and-test-terraform-12:
    environment:
      TF_ACC: 1
    docker:
      - image: cimg/go:1.27.3

    steps:
      - setup:
          terraform-version: "1.12.2"
      - run: task build

      - run:
          name: Update PATH and Define Environment Variable at Runtime
          # Add source command to execute code and make variables
          # available in current step.
          command: |
            echo "export CIRCLE_TOKEN=${CCIPERSONALACCESSTOKEN_ASKSEC_310}" >> "$BASH_ENV"
            source "$BASH_ENV"
      - go/with-cache:
          checksum: *checksum
          steps:
            - run: task ci:test
      - store_results

  build-and-test-terraform-13:
    environment:
      TF_ACC: 1
    docker:
      - image: cimg/go:1.27.3

    steps:
      - setup:
          terraform-version: "1.13.5"
      - run: task build

      - run:
          name: Update PATH and Define Environment Variable at Runtime
          # Add source command to execute code and make variables
          # available in current step.
          command: |
            echo "export CIRCLE_TOKEN=${CCIPERSONALACCESSTOKEN_ASKSEC_310}" >> "$BASH_ENV"
            source "$BASH_ENV"
      - go/with-cache:
          checksum: *checksum
          steps:
            - run: task ci:test
      - store_results

  build-and-test-terraform-14:
    environment:
      TF_ACC: 1
    docker:
      - image: cimg/go:1.27.3

    steps:
      - setup:
          terraform-version: "1.14.6"
      - run: task build

      - run:
          name: Update PATH and Define Environment Variable at Runtime
          # Add source command to execute code and make variables
          # available in current step.
          command: |
            echo "export CIRCLE_TOKEN=${CCIPERSONALACCESSTOKEN_ASKSEC_310}" >> "$BASH_ENV"
            source "$BASH_ENV"
      - go/with-cache:
          checksum: *checksum
          steps:
            - run: task ci:test
      - store_results

  # The live Forgejo acceptance tests, run once rather than in every job of the
  # terraform matrix because they must not run concurrently.
  acceptance-forgejo:
    environment:
      TF_ACC: 1
      CIRCLE_FORGEJO_URL: https://forgejo-forgejo-web.platform.circlecifoundry.org
      CIRCLE_FORGEJO_OWNER: circleci-tf-provider-test
      CIRCLE_FORGEJO_REPO: circleci-tf-provider-test/hello-world
      CIRCLE_FORGEJO_OTHER_REPO: circleci-tf-provider-test/goodbye-world
      CIRCLE_FORGEJO_CONNECTION_AUDIENCE: u:7:01736f9a-2c02-4e37-bd95-cc749aa46e6a
      CIRCLE_FORGEJO_CHECKOUT_AUDIENCE: u:7:4f74e304-2c75-4800-9722-cae14c704e6a
    docker:
      - image: cimg/go:1.27.3
    steps:
      - setup:
          terraform-version: "1.14.6"
      - run:
          name: Define the CircleCI token
          command: |
            echo "export CIRCLE_TOKEN=${CCIPERSONALACCESSTOKEN_ASKSEC_310}" >> "$BASH_ENV"
      - go/with-cache:
          checksum: *checksum
          steps:
            - run: task ci:test -- -run '^TestAccForgejoLive$' ./internal/provider/
      - store_results

  # Fan-in point. Everything above runs in parallel, so follow-on release jobs
  # on main only need to require this one job.
  ci-complete:
    type: no-op

  goreleaser:
    docker:
      - image: cimg/go:1.27.3
    steps:
      - checkout
      - run: task mod-download
      - run:
          name: Import GPG signing key
          command: |
            mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
            gpgconf --kill gpg-agent

            if echo "$GPG_PRIVATE_KEY" | base64 -d 2>/dev/null | grep -q "PGP PRIVATE KEY"; then
              echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --pinentry-mode loopback --passphrase "$PASSPHRASE" --import
            else
              echo "$GPG_PRIVATE_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$PASSPHRASE" --import
            fi

            echo "export GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')" >> "$BASH_ENV"
      - run:
          name: Install GoReleaser
          command: go install github.com/goreleaser/goreleaser/v2@latest
      - run:
          name: Tag and publish release
          command: task ci:release

workflows:
  build-and-test:
    jobs:
      - check
      - test

      # The acceptance tests share one org, so everything they create is named
      # uniquely per run (see testAccUniqueName). That lets the terraform matrix
      # run in parallel; the fixtures these tests only read are safe to share.
      - build-and-test-terraform-12:
          context: CircleCITestOrg-ccipat
      - build-and-test-terraform-13:
          context: CircleCITestOrg-ccipat
      - build-and-test-terraform-14:
          context: CircleCITestOrg-ccipat

      - acceptance-forgejo:
          context: CircleCITestOrg-ccipat
          serial-group: << pipeline.project.slug >>/forgejo-acceptance

      # Every job is listed rather than just the tail of the matrix, so the gate
      # stays correct if the matrix is ever unchained or reordered.
      - ci-complete:
          requires:
            - check
            - test
            - build-and-test-terraform-12
            - build-and-test-terraform-13
            - build-and-test-terraform-14
            - acceptance-forgejo

      # Every merge to main tags and publishes a release; see RELEASE_VERSION
      # in the Taskfile for how the version is derived.
      - goreleaser:
          requires:
            - ci-complete
          context:
            - devex-release
            - release-signing
          filters:
            branches:
              only: main
          serial-group: << pipeline.project.slug >>/goreleaser
