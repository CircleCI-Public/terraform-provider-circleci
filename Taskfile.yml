version: '3'

vars:
  RESULTS_DIR: test-reports
  TEST_REPORT: test-reports/tests.xml
  LINT_REPORT: test-reports/lint.xml

  # Deploy-bot identity used only for the release tag's commit metadata.
  GH_NAME: 'circleci'
  GH_EMAIL: 'ops+deploy-bot@circleci.com'

  # Release series. Every merge to main tags and publishes a strict semver
  # release: v<RELEASE_SERIES>.<patch>, where patch auto-increments from the
  # highest existing tag in this series (see ci:release). Bump RELEASE_SERIES
  # for a deliberate minor or major release — the patch then resets to 0.
  RELEASE_SERIES: '0.5'

tasks:
  build:
    desc: Build the provider
    cmds:
      - go build -v .

  check:
    desc: Run all static checks
    cmds:
      - task: lint
      - task: fmt
        vars:
          CLI_ARGS: --diff ./...
      - task: license
        vars:
          CLI_ARGS: -check .
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff

  fix:
    desc: Auto-fix static checks
    cmds:
      - task: fmt
      - task: license
      - task: mod-tidy
      - task: lint
        vars:
          CLI_ARGS: ./... --fix

  lint:
    desc: Run `golangci-lint run` to lint the code
    summary: Lint the project with golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint run {{.ARGS}}

  lint-migrate:
    desc: Migrate the `golangci-lint` config
    cmds:
      - go tool -modfile tools/go.mod golangci-lint migrate

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint fmt {{.ARGS}}

  license:
    desc: Manage licence headers. Pass `-check .` to verify without writing.
    vars:
      ARGS: '{{default "." .CLI_ARGS}}'
    cmds:
      - |
        go tool -modfile tools/go.mod addlicense \
          -c "Circle Internet Services, Inc." \
          -l mpl \
          -s=only \
          -ignore ".circleci/**" \
          -ignore ".github/ISSUE_TEMPLATE/*.yml" \
          -ignore ".golangci.yml" \
          -ignore ".goreleaser.yml" \
          -ignore ".idea/**" \
          -ignore "examples/**" \
          -ignore "test-reports/**" \
          {{.ARGS}}

  test:
    desc: Run the tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod gotestsum -- -timeout=120s -parallel=10 -race {{.ARGS}}

  generate:
    desc: Run generation of any generated code, including the provider documentation
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go generate -x {{.ARGS}}
      - task: generate-doc

  generate-doc:
    desc: Run generation of terraform provider documentation. Requires terraform on PATH.
    cmds:
      - terraform fmt -recursive ./examples/
      - go tool -modfile tools/go.mod tfplugindocs generate --provider-dir . -provider-name circleci

  mod-tidy:
    desc: Run 'go mod tidy' to clean up module files.
    vars:
      ARGS: '{{default "-v" .CLI_ARGS}}'
    cmds:
      - go mod tidy {{.ARGS}}
      - go -C tools mod tidy {{.ARGS}}

  mod-download:
    desc: Run 'go mod download' to retrieve module files.
    cmds:
      - go mod download -x
      - go mod download -x -modfile tools/go.mod

  # CI specific tasks below here

  ci:lint:
    desc: Run `golangci-lint run` to lint the code, outputting a report.
    cmds:
      - mkdir -p "{{.RESULTS_DIR}}"
      - task: lint
        vars:
          CLI_ARGS: |
            ./... \
            --output.junit-xml.path "{{.LINT_REPORT}}" --output.junit-xml.extended \
            --output.text.path=stdout --output.text.colors=true

  ci:test:
    desc: Run the tests and output the test results
    summary: |
      Runs the unit tests. The acceptance tests skip themselves unless TF_ACC is
      set, which the terraform-matrix CI jobs do at the job level.
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - mkdir -p {{.RESULTS_DIR}}
      - go tool -modfile tools/go.mod gotestsum --junitfile="{{.TEST_REPORT}}" -- -race -cover -timeout 120m -count=1 {{.ARGS}}

  ci:check:
    desc: Check no uncommitted diffs after generate/fmt/tidy
    cmds:
      - task: ci:lint
      - task: fmt
        vars:
          CLI_ARGS: --diff ./...
      - task: license
        vars:
          CLI_ARGS: -check .
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: generate
      - git diff --exit-code

  ci:release:
    desc: Tag, build, and publish a release
    cmds:
      - |
        set -e

        # Only set the deploy-bot identity in CI; never clobber a local git config.
        if [ -n "${CI:-}" ]; then
          git config --global user.email '{{.GH_EMAIL}}'
          git config --global user.name '{{.GH_NAME}}'
        fi

        # Auto-increment the patch from the highest existing tag in this
        # series; a series with no tags yet (i.e. RELEASE_SERIES was just
        # bumped) starts fresh at patch 0.
        git fetch --tags origin
        SERIES='{{.RELEASE_SERIES}}'
        LAST_PATCH=$(git tag -l "v${SERIES}.*" | sed -E "s/^v${SERIES}\.//" | sort -n | tail -1)
        NEXT_PATCH=$(( ${LAST_PATCH:--1} + 1 ))
        VERSION="v${SERIES}.${NEXT_PATCH}"

        echo "Releasing ${VERSION}"
        git tag -a "${VERSION}" -m "Release ${VERSION}"
        git push origin "${VERSION}"
        goreleaser release --clean
